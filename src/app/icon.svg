<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2c" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado elegante con borde degradado -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3.5" />

  <!-- Símbolo: Mando Gamer / Claqueta estilizado -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Contorno Mando Gamer -->
    <path d="M19 28c-4 0-7 3.5-7 7.5 0 3 2 5.5 5 6.5l3 5c1 1.5 2.5 2 4 1 1.5-1 2-3 2-5h12c0 2 .5 4 2 5 1.5 1 3 .5 4-1l3-5c3-1 5-3.5 5-6.5 0-4-3-7.5-7-7.5H19z" fill="#1e1035" />
    
    <!-- D-Pad (Cruceta) -->
    <path d="M22 33v6M19 36h6" stroke="#c084fc" stroke-width="2.5" />
    
    <!-- Botones de Acción -->
    <circle cx="43" cy="34" r="1.5" fill="#38bdf8" stroke="none" />
    <circle cx="40" cy="37" r="1.5" fill="#f43f5e" stroke="none" />
    <circle cx="46" cy="37" r="1.5" fill="#4ade80" stroke="none" />
    <circle cx="43" cy="40" r="1.5" fill="#fbbf24" stroke="none" />
    
    <!-- Tira de Película / Cinta de Cine superior -->
    <path d="M18 19h28" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <circle cx="23" cy="19" r="1" fill="#f59e0b" stroke="none" />
    <circle cx="32" cy="19" r="1" fill="#f59e0b" stroke="none" />
    <circle cx="41" cy="19" r="1" fill="#f59e0b" stroke="none" />
  </g>
</svg>

